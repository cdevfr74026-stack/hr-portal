<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR 作業中心｜HR Knowledge Portal</title>
<meta name="description" content="企業內部 HR 知識中心：SOP、操作流程、表單與 FAQ 的集中查詢入口。">

<!-- Typography: Noto Sans TC (中文) + Inter (英文/數字) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Mobile-only top bar: hamburger + brand + quick search -->
  <div class="topbar">
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="開啟選單">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 7H20M4 12H20M4 17H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="topbar-brand">
      <span>🗂</span> HR 作業中心
    </div>
    <a class="hamburger-btn" href="#/search" aria-label="搜尋">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </a>
  </div>

  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <nav id="sidebarNav" aria-label="主選單"><!-- injected by router.js --></nav>
    </aside>

    <main class="main-content">
      <div class="content-inner" id="contentInner">
        <!-- injected by router.js -->
      </div>
    </main>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <!-- Firebase（compat 版 SDK，不需要 npm/build 工具，直接用 <script> 就能用）-->
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>

  <script src="js/data.js"></script>
  <script src="js/render.js"></script>
  <script src="js/router.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase-loader.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
