<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR 作業中心｜HR Knowledge Portal</title>
<meta name="description" content="企業內部 HR 知識中心：SOP、操作流程、表單與 FAQ 的集中查詢入口。">

<!-- Typography: Noto Sans TC (中文) + Inter (英文/數字) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ======================================================================
   HR 作業中心 — Design System
   ----------------------------------------------------------------------
   Color / Type / Spacing tokens live at the top as CSS variables.
   Every component below is built only from these tokens so the whole
   site stays consistent as new HR modules are added.
   ====================================================================== */

/* ---------- Design Tokens ---------- */
:root {
  /* Color */
  --color-bg: #F7F8FA;
  --color-surface: #FFFFFF;
  --color-primary: #6E9ECF;
  --color-primary-soft: #EAF1F9;
  --color-secondary: #B8CBB8;
  --color-secondary-soft: #EEF3EE;
  --color-accent: #D8C3A5;
  --color-accent-soft: #F6F0E7;
  --color-border: #E8EAED;
  --color-title: #2F3A45;
  --color-body: #5F6B76;
  --color-caption: #8A949E;
  --color-danger: #C97B6B;
  --color-success: #7FA98B;

  /* Typography */
  --font-zh: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-en: "Inter", "Noto Sans TC", sans-serif;
  --font-base: var(--font-en), var(--font-zh);

  /* Spacing — 8pt grid */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 16px;
  --sp-4: 24px;
  --sp-5: 32px;
  --sp-6: 40px;
  --sp-7: 48px;
  --sp-8: 64px;
  --sp-9: 80px;
  --sp-10: 96px;

  /* Radius */
  --radius-card: 20px;
  --radius-btn: 999px;
  --radius-sm: 12px;
  --radius-input: 14px;

  /* Shadow — very soft */
  --shadow-sm: 0 1px 2px rgba(47, 58, 69, 0.04);
  --shadow-card: 0 2px 8px rgba(47, 58, 69, 0.05), 0 1px 2px rgba(47, 58, 69, 0.03);
  --shadow-card-hover: 0 12px 28px rgba(47, 58, 69, 0.10), 0 2px 6px rgba(47, 58, 69, 0.04);
  --shadow-float: 0 20px 48px rgba(47, 58, 69, 0.14);

  /* Layout */
  --sidebar-w: 264px;
  --sidebar-w-collapsed: 84px;
  --header-h: 72px;
  --transition: 220ms cubic-bezier(0.4, 0, 0.2, 1);
}

/* ---------- Reset ---------- */
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
}
body {
  background: var(--color-bg);
  color: var(--color-body);
  font-family: var(--font-base);
  font-weight: 400;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  letter-spacing: 0.01em;
}
h1, h2, h3, h4, h5, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
img { max-width: 100%; display: block; }

h1, h2, h3, h4, .title-font {
  font-family: var(--font-en), var(--font-zh);
  font-weight: 700;
  color: var(--color-title);
  letter-spacing: 0;
}

/* Respect reduced-motion preference */
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* Visible keyboard focus everywhere */
a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: 6px;
}

/* ---------- App Shell ---------- */
.app-shell {
  display: flex;
  min-height: 100vh;
}

/* ---------- Sidebar ---------- */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  transition: width var(--transition);
  z-index: 40;
}
.sidebar.is-collapsed { width: var(--sidebar-w-collapsed); }

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-5) var(--sp-4) var(--sp-4);
  min-height: var(--header-h);
}
.sidebar-brand-mark {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  background: linear-gradient(145deg, var(--color-primary), #8FB6DE);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 15px;
  flex-shrink: 0;
}
.sidebar-brand-text {
  font-weight: 700;
  font-size: 15px;
  color: var(--color-title);
  white-space: nowrap;
  overflow: hidden;
  opacity: 1;
  transition: opacity var(--transition);
}
.sidebar.is-collapsed .sidebar-brand-text { opacity: 0; width: 0; }

.sidebar-collapse-btn {
  margin: 0 var(--sp-3) var(--sp-2);
  align-self: flex-end;
  width: 32px;
  height: 32px;
  border-radius: 10px;
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  color: var(--color-caption);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background var(--transition), color var(--transition);
}
.sidebar-collapse-btn:hover { background: var(--color-primary-soft); color: var(--color-primary); }

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: var(--sp-2) var(--sp-3) var(--sp-4);
}
.sidebar-nav-divider {
  height: 1px;
  background: var(--color-border);
  margin: var(--sp-3) var(--sp-2);
}
.sidebar-link {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: 11px var(--sp-3);
  border-radius: var(--radius-sm);
  color: var(--color-body);
  font-size: 14.5px;
  font-weight: 500;
  margin-bottom: 2px;
  transition: background var(--transition), color var(--transition);
  white-space: nowrap;
  overflow: hidden;
}
.sidebar-link .icon { font-size: 17px; flex-shrink: 0; width: 20px; text-align: center; }
.sidebar-link span.label { opacity: 1; transition: opacity var(--transition); }
.sidebar.is-collapsed .sidebar-link span.label { opacity: 0; width: 0; }
.sidebar-link:hover { background: var(--color-bg); color: var(--color-title); }
.sidebar-link.is-active { background: var(--color-primary-soft); color: var(--color-primary); }

.sidebar-footer {
  padding: var(--sp-4) var(--sp-4);
  border-top: 1px solid var(--color-border);
  font-size: 12px;
  color: var(--color-caption);
  white-space: nowrap;
  overflow: hidden;
}
.sidebar.is-collapsed .sidebar-footer { opacity: 0; }

/* Mobile sidebar behaviour */
.sidebar-scrim {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(47, 58, 69, 0.32);
  z-index: 39;
}

/* ---------- Header ---------- */
.topbar {
  height: var(--header-h);
  display: none;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--sp-4);
  background: rgba(247, 248, 250, 0.9);
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  z-index: 30;
  border-bottom: 1px solid transparent;
}
.hamburger-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  display: flex;
  align-items: center;
  justify-content: center;
}
.topbar-brand { font-weight: 700; color: var(--color-title); font-size: 15px; display: flex; align-items: center; gap: 8px; }

/* ---------- Main Content ---------- */
.main-content {
  flex: 1;
  min-width: 0;
}
.content-inner {
  max-width: 1120px;
  margin: 0 auto;
  padding: var(--sp-7) var(--sp-6) var(--sp-10);
}

/* ---------- Breadcrumb ---------- */
.breadcrumb {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 13.5px;
  color: var(--color-caption);
  margin-bottom: var(--sp-5);
}
.breadcrumb a { color: var(--color-caption); transition: color var(--transition); }
.breadcrumb a:hover { color: var(--color-primary); }
.breadcrumb .current { color: var(--color-title); font-weight: 500; }
.breadcrumb .sep { color: var(--color-border); }

/* ---------- Hero / Search ---------- */
.hero {
  text-align: center;
  padding: var(--sp-8) 0 var(--sp-7);
}
.hero-eyebrow {
  font-size: 13px;
  font-weight: 600;
  color: var(--color-primary);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: var(--sp-3);
}
.hero-title {
  font-size: 40px;
  line-height: 1.3;
  margin-bottom: var(--sp-3);
}
.hero-subtitle {
  font-size: 16px;
  color: var(--color-body);
  max-width: 480px;
  margin: 0 auto var(--sp-6);
}

.search-bar {
  max-width: 640px;
  margin: 0 auto;
  position: relative;
}
.search-bar input {
  width: 100%;
  height: 60px;
  border-radius: var(--radius-btn);
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  padding: 0 var(--sp-6) 0 60px;
  font-size: 16px;
  font-family: inherit;
  color: var(--color-title);
  box-shadow: var(--shadow-card);
  transition: box-shadow var(--transition), border-color var(--transition);
}
.search-bar input::placeholder { color: var(--color-caption); }
.search-bar input:focus {
  outline: none;
  border-color: var(--color-primary);
  box-shadow: 0 0 0 4px var(--color-primary-soft);
}
.search-bar .search-icon {
  position: absolute;
  left: 24px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--color-caption);
  pointer-events: none;
}
.search-hint {
  margin-top: var(--sp-3);
  font-size: 12.5px;
  color: var(--color-caption);
}

/* small search bar used in category header */
.search-bar.compact input { height: 48px; padding-left: 50px; font-size: 14.5px; }
.search-bar.compact .search-icon { left: 18px; }

/* ---------- Grid ---------- */
.card-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--sp-4);
}
@media (max-width: 980px) { .card-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 620px) { .card-grid { grid-template-columns: 1fr; } }

/* ---------- Category Card (Home) ---------- */
.category-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  padding: var(--sp-5);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  box-shadow: var(--shadow-card);
  transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
}
.category-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-card-hover);
  border-color: transparent;
}
.category-card .card-icon {
  width: 52px;
  height: 52px;
  border-radius: 16px;
  background: var(--color-primary-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
}
.category-card h3 { font-size: 17px; }
.category-card p { font-size: 14px; color: var(--color-body); }
.category-card .card-arrow {
  margin-top: auto;
  font-size: 13px;
  font-weight: 600;
  color: var(--color-primary);
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ---------- SOP / Process Card (Category page) ---------- */
.sop-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  padding: var(--sp-4) var(--sp-4) var(--sp-3);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  box-shadow: var(--shadow-card);
  transition: transform var(--transition), box-shadow var(--transition);
}
.sop-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-card-hover); }
.sop-card-top { display: flex; align-items: center; gap: var(--sp-3); }
.sop-card .card-icon {
  width: 44px; height: 44px; border-radius: 13px;
  background: var(--color-secondary-soft);
  display: flex; align-items: center; justify-content: center; font-size: 20px;
  flex-shrink: 0;
}
.sop-card h4 { font-size: 15.5px; }
.sop-card p { font-size: 13.5px; color: var(--color-body); flex: 1; }
.sop-card-empty { font-size: 13.5px; color: var(--color-caption); flex: 1; font-style: normal; }

/* Preview bullet list — a quick peek at what's inside before drilling in */
.sop-card-preview {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 2px 0;
}
.sop-card-preview li {
  position: relative;
  padding-left: 16px;
  font-size: 13.5px;
  color: var(--color-body);
  line-height: 1.5;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sop-card-preview li::before {
  content: "";
  position: absolute;
  left: 2px;
  top: 8px;
  width: 4px;
  height: 4px;
  border-radius: 999px;
  background: var(--color-primary);
  opacity: 0.55;
}
.sop-card-footer {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: var(--sp-2); padding-top: var(--sp-3); border-top: 1px solid var(--color-border);
}
.read-link {
  font-size: 13px; font-weight: 600; color: var(--color-primary);
  display: flex; align-items: center; gap: 4px;
}
.sop-card:hover .read-link { gap: 7px; }
.read-link svg { transition: transform var(--transition); }

/* ---------- Badge ---------- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 12px;
  border-radius: var(--radius-btn);
  font-size: 12px;
  font-weight: 600;
  background: var(--color-secondary-soft);
  color: #5D7A5D;
}
.badge.badge-accent { background: var(--color-accent-soft); color: #8A6D3F; }
.badge.badge-primary { background: var(--color-primary-soft); color: var(--color-primary); }
.badge.badge-muted { background: var(--color-bg); color: var(--color-caption); border: 1px solid var(--color-border); }

/* ---------- Button ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 44px;
  padding: 0 var(--sp-4);
  border-radius: var(--radius-btn);
  font-size: 14.5px;
  font-weight: 600;
  border: 1px solid transparent;
  transition: transform var(--transition), background var(--transition), box-shadow var(--transition), border-color var(--transition);
}
.btn-primary { background: var(--color-primary); color: #fff; box-shadow: var(--shadow-sm); }
.btn-primary:hover { background: #5F8FC0; box-shadow: var(--shadow-card); }
.btn-secondary { background: var(--color-surface); color: var(--color-title); border-color: var(--color-border); }
.btn-secondary:hover { border-color: var(--color-primary); color: var(--color-primary); }
.btn-ghost { background: transparent; color: var(--color-body); }
.btn-ghost:hover { background: var(--color-bg); }
.btn-sm { height: 36px; padding: 0 var(--sp-3); font-size: 13px; }
.btn:active { transform: scale(0.97); }

/* ---------- Page Header (Category / SOP) ---------- */
.page-header { margin-bottom: var(--sp-6); }
.page-header .cat-icon-lg {
  width: 56px; height: 56px; border-radius: 17px;
  background: var(--color-primary-soft);
  display: flex; align-items: center; justify-content: center; font-size: 26px;
  margin-bottom: var(--sp-3);
}
.page-header h1 { font-size: 30px; margin-bottom: var(--sp-2); }
.page-header .page-desc { font-size: 15px; color: var(--color-body); max-width: 640px; }
.page-header .meta-row { display: flex; gap: var(--sp-3); align-items: center; margin-top: var(--sp-3); flex-wrap: wrap; }
.meta-item { font-size: 13px; color: var(--color-caption); display: flex; align-items: center; gap: 6px; }

/* ---------- Section ---------- */
.doc-section { margin-top: var(--sp-8); }
.doc-section-title {
  display: flex; align-items: center; gap: var(--sp-3);
  font-size: 20px; margin-bottom: var(--sp-4);
}
.doc-section-title .num {
  width: 30px; height: 30px; border-radius: 10px;
  background: var(--color-title); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; flex-shrink: 0;
}
.section-panel {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  padding: var(--sp-5);
}
.section-panel p + p { margin-top: var(--sp-2); }
.section-panel p { font-size: 15px; color: var(--color-body); }

/* ---------- Flow Chart ---------- */
.flow-chart {
  display: flex;
  align-items: stretch;
  gap: 0;
  overflow-x: auto;
  padding: var(--sp-2) 0;
}
.flow-step {
  flex: 1 0 150px;
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: var(--sp-3);
  text-align: center;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--color-title);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 64px;
}
.flow-arrow {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 var(--sp-2);
  color: var(--color-caption);
}

/* ---------- Step Card ---------- */
.step-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  padding: var(--sp-5);
  margin-bottom: var(--sp-4);
}
.step-card-head {
  display: flex; align-items: center; gap: var(--sp-3);
  margin-bottom: var(--sp-4);
}
.step-badge {
  width: 40px; height: 40px; border-radius: 12px;
  background: var(--color-accent-soft); color: #8A6D3F;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; flex-shrink: 0;
}
.step-card-head h3 { font-size: 17px; }
.step-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-4);
}
@media (max-width: 720px) { .step-grid { grid-template-columns: 1fr; } }
.step-field .field-label {
  font-size: 12.5px; font-weight: 700; color: var(--color-primary);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
}
.step-field .field-body { font-size: 14.5px; color: var(--color-body); }
.step-field ul.dash-list li {
  position: relative; padding-left: 16px; margin-bottom: 6px; font-size: 14.5px; color: var(--color-body);
}
.step-field ul.dash-list li::before {
  content: "–"; position: absolute; left: 0; color: var(--color-caption);
}
.step-field.full { grid-column: 1 / -1; }

/* ---------- Resource Path (folder breadcrumb, distinct from nav breadcrumb) ---------- */
.resource-path {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  padding: var(--sp-3);
  background: var(--color-accent-soft);
  border-radius: var(--radius-sm);
}
.path-chip {
  font-size: 13.5px;
  font-weight: 600;
  color: #8A6D3F;
  background: var(--color-surface);
  border: 1px solid rgba(138, 109, 63, 0.18);
  border-radius: 8px;
  padding: 5px 10px;
  white-space: nowrap;
}
.path-arrow { color: #A88E63; display: flex; align-items: center; opacity: 0.7; }

/* ---------- Resource Link / Credentials ---------- */
.resource-link-card {
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  align-items: flex-start;
}
.resource-cred-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.cred-label {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--color-caption);
  width: 40px;
  flex-shrink: 0;
}
.cred-value {
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 13.5px;
  color: var(--color-title);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: 8px;
  padding: 4px 10px;
}
.cred-btn {
  height: 28px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  color: var(--color-body);
  font-size: 12px;
  font-weight: 600;
  transition: border-color var(--transition), color var(--transition);
}
.cred-btn:hover { border-color: var(--color-primary); color: var(--color-primary); }
.resource-note {
  font-size: 12.5px;
  color: #A0765F;
  margin-top: 2px;
}

/* ---------- Example Image Gallery ---------- */
.example-gallery {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--sp-3);
}
@media (max-width: 620px) { .example-gallery { grid-template-columns: 1fr; } }
.example-figure { margin: 0; }
.example-image-wrap {
  aspect-ratio: 16 / 10;
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ======================================================================
   HR 作業中心 — Render Layer
   ----------------------------------------------------------------------
   Pure functions that turn HR_DATA into HTML strings. No routing logic
   here — router.js decides *which* of these to call and where to mount
   the result.
   ====================================================================== */

const Render = (() => {

  function esc(str) {
    if (str == null) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function findCategory(catId) {
    return HR_DATA.categories.find(c => c.id === catId) || null;
  }
  function findCard(catId, cardId) {
    const cat = findCategory(catId);
    if (!cat) return null;
    const card = cat.cards.find(c => c.id === cardId);
    return card ? { cat, card } : null;
  }

  /* ---------------- Sidebar ---------------- */
  function sidebar(activeCatId) {
    const links = HR_DATA.categories.map(cat => `
      <a class="sidebar-link ${cat.id === activeCatId ? "is-active" : ""}" href="#/category/${cat.id}">
        <span class="icon">${cat.icon}</span><span class="label">${esc(cat.name)}</span>
      </a>`).join("");

    return `
      <div class="sidebar-brand">
        <div class="sidebar-brand-mark">HR</div>
        <div class="sidebar-brand-text">HR 作業中心</div>
      </div>
      <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="收合側邊欄" title="收合／展開側邊欄">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 4L15 12L9 20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <nav class="sidebar-nav">
        <a class="sidebar-link ${!activeCatId ? "is-active" : ""}" href="#/">
          <span class="icon">🏠</span><span class="label">首頁</span>
        </a>
        <div class="sidebar-nav-divider"></div>
        ${links}
      </nav>
      <div class="sidebar-footer">HR 作業中心 · 內部版</div>
    `;
  }

  /* ---------------- Breadcrumb ---------------- */
  function breadcrumb(parts) {
    // parts: [{label, href}] — last item has no href (current page)
    return `<nav class="breadcrumb" aria-label="Breadcrumb">` + parts.map((p, i) => {
      const isLast = i === parts.length - 1;
      const sep = i > 0 ? `<span class="sep">/</span>` : "";
      if (isLast) return `${sep}<span class="current">${esc(p.label)}</span>`;
      return `${sep}<a href="${p.href}">${esc(p.label)}</a>`;
    }).join("") + `</nav>`;
  }

  /* ---------------- Home ---------------- */
  function home() {
    const cards = HR_DATA.categories.map(cat => `
      <a class="category-card" href="#/category/${cat.id}">
        <div class="card-icon">${cat.icon}</div>
        <h3>${esc(cat.name)}</h3>
        <p>${esc(cat.tagline)}</p>
        <span class="card-arrow">前往查看
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </a>`).join("");

    return `
      <div class="hero">
        <div class="hero-eyebrow">HR Knowledge Portal</div>
        <h1 class="hero-title">HR 作業中心</h1>
        <p class="hero-subtitle">所有制度、流程與表單，都在這裡。找到你需要的 SOP，安心完成每一項作業。</p>
        <form class="search-bar" id="homeSearchForm" role="search">
          <span class="search-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </span>
          <input type="search" id="homeSearchInput" placeholder="搜尋制度、流程、SOP、表單..." aria-label="搜尋">
        </form>
        <p class="search-hint">試試看：績效面談、調薪、健檢、報到</p>
      </div>
      <div class="card-grid">${cards}</div>
    `;
  }

  /* ---------------- Category Page ---------------- */
  function category(catId) {
    const cat = findCategory(catId);
    if (!cat) return notFound();

    const cards = cat.cards.map(card => {
      const meta = cardMeta(card);
      const preview = cardPreview(card);
      return `
      <a class="sop-card" href="#/sop/${cat.id}/${card.id}">
        <div class="sop-card-top">
          <div class="card-icon">${card.icon}</div>
          <h4>${esc(card.title)}</h4>
        </div>
        ${preview.length
          ? `<ul class="sop-card-preview">${preview.map(p => `<li>${esc(p)}</li>`).join("")}</ul>`
          : `<p class="sop-card-empty">${esc(card.description)}</p>`}
        <div class="sop-card-footer">
          <span class="badge ${meta.badgeClass}">${meta.badgeLabel}</span>
          <span class="read-link">${meta.ctaLabel}
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </div>
      </a>`;
    }).join("");

    return `
      ${breadcrumb([{ label: "首頁", href: "#/" }, { label: cat.name }])}
      <div class="page-header">
        <div class="cat-icon-lg">${cat.icon}</div>
        <h1>${esc(cat.name)}</h1>
        <p class="page-desc">${esc(cat.description)}</p>
      </div>
      <div class="card-grid">${cards}</div>
    `;
  }

  /* Short preview list shown on the category-page card, before drilling
     into the full detail page. sop → first steps' titles;
     downloads → file names; faq → the questions themselves. */
  function cardPreview(card) {
    const LIMIT = 4;
    if (card.type === "sop" && card.sop && card.sop.steps && card.sop.steps.length) {
      return card.sop.steps.slice(0, LIMIT).map(s => s.title);
    }
    if (card.type === "downloads" && card.downloads && card.downloads.length) {
      return card.downloads.slice(0, LIMIT).map(d => d.name.replace(/\.[a-zA-Z0-9]+$/, ""));
    }
    if (card.type === "faq" && card.faqs && card.faqs.length) {
      return card.faqs.slice(0, LIMIT).map(f => f.q);
    }
    return [];
  }

  function cardMeta(card) {
    if (card.type === "downloads") return { badgeClass: "badge-accent", badgeLabel: "表單", ctaLabel: "查看表單" };
    if (card.type === "faq") return { badgeClass: "badge-muted", badgeLabel: "FAQ", ctaLabel: "查看 FAQ" };
    if (card.sop) return { badgeClass: "badge-primary", badgeLabel: card.sop.version, ctaLabel: "查看流程" };
    return { badgeClass: "badge-muted", badgeLabel: "建置中", ctaLabel: "查看流程" };
  }

  /* ---------------- SOP / Card Detail Page ---------------- */
  function cardDetail(catId, cardId) {
    const found = findCard(catId, cardId);
    if (!found) return notFound();
    const { cat, card } = found;

    const crumbs = [{ label: "首頁", href: "#/" }, { label: cat.name, href: `#/category/${cat.id}` }, { label: card.title }];

    if (card.type === "downloads") {
      return `
        ${breadcrumb(crumbs)}
        <div class="page-header">
          <div class="cat-icon-lg">${card.icon}</div>
          <h1>${esc(card.title)}</h1>
          <p class="page-desc">${esc(card.description)}</p>
        </div>
        ${card.downloads && card.downloads.length ? downloadGrid(card.downloads) : emptyState("表單建置中", "此分類的表單尚未上傳，補充後將於此處顯示。")}
        ${feedbackStrip()}
      `;
    }

    if (card.type === "faq") {
      return `
        ${breadcrumb(crumbs)}
        <div class="page-header">
          <div class="cat-icon-lg">${card.icon}</div>
          <h1>${esc(card.title)}</h1>
          <p class="page-desc">${esc(card.description)}</p>
        </div>
        ${card.faqs && card.faqs.length ? accordionList(card.faqs, "faq") : emptyState("尚無常見問題", "此分類的 FAQ 尚未建置，補充後將於此處顯示。")}
        ${feedbackStrip()}
      `;
    }

    // type === 'sop'
    if (!card.sop) {
      return `
        ${breadcrumb(crumbs)}
        <div class="page-header">
          <div class="cat-icon-lg">${card.icon}</div>
          <h1>${esc(card.title)}</h1>
          <p class="page-desc">${esc(card.description)}</p>
        </div>
        ${emptyState("內容建置中", "這份 SOP 尚未撰寫完成，歡迎補充內容，架構已備妥可直接套用範本。")}
      `;
    }

    const sop = card.sop;
    return `
      ${breadcrumb(crumbs)}
      <div class="page-header">
        <div class="cat-icon-lg">${card.icon}</div>
        <h1>${esc(card.title)}</h1>
        <p class="page-desc">${esc(card.description)}</p>
        <div class="meta-row">
          <span class="badge badge-primary">版本 ${esc(sop.version)}</span>
          <span class="meta-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 8V12L15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/></svg>
            最後更新於 ${esc(sop.updatedDate)}
          </span>
        </div>
      </div>

      <div class="doc-section">
        <div class="doc-section-title"><span class="num">1</span>流程說明</div>
        <div class="section-panel"><p>${esc(sop.summary)}</p></div>
      </div>

      ${sop.flow && sop.flow.length ? `
      <div class="doc-section">
        <div class="doc-section-title"><span class="num">2</span>流程圖</div>
        ${flowChart(sop.flow)}
      </div>` : ""}

      <div class="doc-section">
        <div class="doc-section-title"><span class="num">3</span>操作步驟</div>
        ${sop.steps.map((s, i) => stepCard(s, i + 1)).join("")}
      </div>

      ${sop.faqs && sop.faqs.length ? `
      <div class="doc-section">
        <div class="doc-section-title"><span class="num">4</span>FAQ</div>
        ${accordionList(sop.faqs, "faq")}
      </div>` : ""}

      ${sop.downloads && sop.downloads.length ? `
      <div class="doc-section">
        <div class="doc-section-title"><span class="num">5</span>附件下載</div>
        ${downloadGrid(sop.downloads)}
      </div>` : ""}

      ${sop.related && sop.related.length ? `
      <div class="doc-section">
        <div class="doc-section-title"><span class="num">6</span>相關制度</div>
        <div class="related-list">
          ${sop.related.map(r => `
            <a class="related-item" href="#/sop/${r.categoryId}/${r.cardId}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              ${esc(r.label)}
            </a>`).join("")}
        </div>
      </div>` : ""}

      <div class="doc-section">
        <div class="doc-section-title"><span class="num">7</span>版本紀錄</div>
        <div class="section-panel">
          <table class="version-table">
            <thead><tr><th>版本</th><th>日期</th><th>說明</th></tr></thead>
            <tbody>
              ${sop.versionHistory.map(v => `<tr><td>${esc(v.version)}</td><td>${esc(v.date)}</td><td>${esc(v.note)}</td></tr>`).join("")}
            </tbody>
          </table>
        </div>
      </div>

      ${feedbackStrip()}
    `;
  }

  function flowChart(steps) {
    const items = steps.map((s, i) => {
      const arrow = i < steps.length - 1 ? `
        <div class="flow-arrow">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>` : "";
      return `<div class="flow-step">${esc(s)}</div>${arrow}`;
    }).join("");
    return `<div class="section-panel"><div class="flow-chart">${items}</div></div>`;
  }

  function stepCard(step, index) {
    return `
      <div class="step-card">
        <div class="step-card-head">
          <div class="step-badge">${index < 10 ? "0" + index : index}</div>
          <h3>STEP ${index}．${esc(step.title)}</h3>
        </div>
        <div class="step-grid">
          <div class="step-field"><div class="field-label">目的</div><div class="field-body">${esc(step.purpose)}</div></div>
          <div class="step-field"><div class="field-label">適用情境</div><div class="field-body">${esc(step.scope)}</div></div>
          <div class="step-field full"><div class="field-label">操作步驟</div>
            <ul class="dash-list">${step.actions.map(a => `<li>${esc(a)}</li>`).join("")}</ul>
          </div>
          <div class="step-field"><div class="field-label">注意事項</div>
            <ul class="dash-list">${step.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>
          </div>
          <div class="step-field">
            <div class="field-label">所需文件</div>
            <ul class="dash-list">${step.documents.map(d => `<li>${esc(d)}</li>`).join("")}</ul>
          </div>
          <div class="step-field full"><div class="field-label">完成條件</div><div class="field-body">${esc(step.completion)}</div></div>
          ${step.resourcePath ? resourcePathField(step.resourcePath) : ""}
          ${step.resourceLink ? resourceLinkField(step.resourceLink) : ""}
          ${step.images && step.images.length ? imageGalleryField(step.images) : ""}
        </div>
      </div>
    `;
  }

  /* Folder/path breadcrumb — "supporting materials live here" style,
     distinct from page navigation breadcrumb at the top of the page. */
  function resourcePathField(path) {
    const chips = path.map((p, i) => {
      const arrow = i < path.length - 1
        ? `<span class="path-arrow"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`
        : "";
      return `<span class="path-chip">${esc(p)}</span>${arrow}`;
    }).join("");
    return `
      <div class="step-field full">
        <div class="field-label">📁 資料存放路徑</div>
        <div class="resource-path">${chips}</div>
      </div>`;
  }

  /* External system link + shared account/password reference. */
  function resourceLinkField(link) {
    return `
      <div class="step-field full">
        <div class="field-label">🔗 系統存取資訊</div>
        <div class="resource-link-card">
          ${link.url ? `
          <a class="btn btn-secondary btn-sm" href="${esc(link.url)}" target="_blank" rel="noopener noreferrer">
            前往${esc(link.urlLabel || "申請網站")}
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M7 17L17 7M17 7H8M17 7V16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>` : ""}
          ${link.account ? `
          <div class="resource-cred-row">
            <span class="cred-label">帳號</span>
            <code class="cred-value">${esc(link.account)}</code>
            <button class="cred-btn copy-btn" type="button" data-copy="${esc(link.account)}">複製</button>
          </div>` : ""}
          ${link.password ? `
          <div class="resource-cred-row">
            <span class="cred-label">密碼</span>
            <code class="cred-value cred-masked" data-secret="${esc(link.password)}">••••••••</code>
            <button class="cred-btn reveal-btn" type="button">顯示</button>
            <button class="cred-btn copy-btn" type="button" data-copy="${esc(link.password)}">複製</button>
          </div>` : ""}
          <p class="resource-note">⚠️ ${esc(link.note || "此為共用帳號，請妥善保管，勿轉傳至外部或公開頻道。")}</p>
        </div>
      </div>`;
  }

  /* Example screenshots with captions — walks the reader through what
     the actual screen/form looks like at this step. */
  function imageGalleryField(images) {
    const figures = images.map(img => `
      <figure class="example-figure">
        <div class="example-image-wrap">
          ${img.src
            ? `<img src="${esc(img.src)}" alt="${esc(img.caption || "")}" loading="lazy">`
            : `<div class="example-image-placeholder">🖼<span>尚未加入範例圖片<br>將圖片放入 assets/images/ 後於 data.js 填入路徑</span></div>`}
        </div>
        ${img.caption ? `<figcaption>${esc(img.caption)}</figcaption>` : ""}
      </figure>`).join("");
    return `
      <div class="step-field full">
        <div class="field-label">🖼 範例圖解</div>
        <div class="example-gallery">${figures}</div>
      </div>`;
  }

  function accordionList(items, kind) {
    const rows = items.map((item, i) => `
      <div class="accordion-item" data-kind="${kind}">
        <button class="accordion-trigger" type="button" aria-expanded="false">
          <span>${esc(item.q)}</span>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="accordion-panel"><p>${esc(item.a)}</p></div>
      </div>`).join("");
    return `<div class="accordion-list">${rows}</div>`;
  }

  function downloadGrid(downloads) {
    const cards = downloads.map(d => `
      <a class="download-card" href="#" data-file-name="${esc(d.name)}">
        <div class="file-icon">${esc(d.type)}</div>
        <div class="file-info">
          <div class="file-name">${esc(d.name)}</div>
          <div class="file-meta">${esc(d.type)} · ${esc(d.size)}</div>
        </div>
        <div class="file-action">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 4V16M12 16L7 11M12 16L17 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 20H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
      </a>`).join("");
    return `<div class="download-grid">${cards}</div>`;
  }

  function emptyState(title, desc) {
    return `
      <div class="empty-state">
        <div class="icon">🌱</div>
        <h3>${esc(title)}</h3>
        <p>${esc(desc)}</p>
      </div>`;
  }

  function feedbackStrip() {
    return `
      <div class="feedback-strip">
        <p>這份 SOP 對你有幫助嗎？歡迎回報問題或提出建議。</p>
        <button class="btn btn-secondary btn-sm" id="openFeedbackBtn" type="button">回報問題</button>
      </div>`;
  }

  function notFound() {
    return `
      ${breadcrumb([{ label: "首頁", href: "#/" }, { label: "找不到頁面" }])}
      ${emptyState("找不到這個頁面", "連結可能已失效，請回到首頁重新尋找需要的制度或流程。")}
      <div style="text-align:center; margin-top: 24px;">
        <a class="btn btn-primary" href="#/">回到首頁</a>
      </div>
    `;
  }

  /* ---------------- Search ---------------- */
  function buildSearchIndex() {
    const index = [];
    HR_DATA.categories.forEach(cat => {
      cat.cards.forEach(card => {
        index.push({
          title: card.title,
          desc: card.description,
          path: `${cat.name} / ${card.title}`,
          href: `#/sop/${cat.id}/${card.id}`
        });
        if (card.type === "faq" && card.faqs) {
          card.faqs.forEach(f => index.push({
            title: f.q, desc: f.a, path: `${cat.name} / FAQ`, href: `#/sop/${cat.id}/${card.id}`
          }));
        }
        if (card.sop && card.sop.faqs) {
          card.sop.faqs.forEach(f => index.push({
            title: f.q, desc: f.a, path: `${cat.name} / ${card.title} / FAQ`, href: `#/sop/${cat.id}/${card.id}`
          }));
        }
      });
    });
    return index;
  }

  function search(query, page) {
    page = page || 1;
    const perPage = 6;
    const q = (query || "").trim().toLowerCase();
    const all = buildSearchIndex();
    const results = q ? all.filter(item =>
      (item.title + item.desc).toLowerCase().includes(q)
    ) : [];

    const totalPages = Math.max(1, Math.ceil(results.length / perPage));
    const clampedPage = Math.min(Math.max(1, page), totalPages);
    const pageItems = results.slice((clampedPage - 1) * perPage, clampedPage * perPage);

    const list = pageItems.map(r => `
      <a class="result-item" href="${r.href}">
        <div class="result-path">${esc(r.path)}</div>
        <h4>${esc(r.title)}</h4>
        <p>${esc(r.desc)}</p>
      </a>`).join("");

    return `
      ${breadcrumb([{ label: "首頁", href: "#/" }, { label: "搜尋結果" }])}
      <div class="page-header">
        <h1>搜尋結果</h1>
        <p class="page-desc">「${esc(query || "")}」共找到 ${results.length} 筆結果</p>
        <form class="search-bar compact" id="searchPageForm" role="search" style="margin: var(--sp-4) 0 0;">
          <span class="search-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </span>
          <input type="search" id="searchPageInput" value="${esc(query || "")}" placeholder="搜尋制度、流程、SOP、表單...">
        </form>
      </div>
      ${results.length ? list : emptyState("查無相關結果", "換個關鍵字試試，或直接從左側選單瀏覽分類。")}
      ${totalPages > 1 ? pagination(clampedPage, totalPages, query) : ""}
    `;
  }

  function pagination(current, total, query) {
    let buttons = "";
    for (let i = 1; i <= total; i++) {
      buttons += `<button class="page-btn ${i === current ? "is-active" : ""}" data-page="${i}">${i}</button>`;
    }
    return `
      <div class="pagination" data-query="${esc(query || "")}">
        <button class="page-btn" data-page="${current - 1}" ${current === 1 ? "disabled" : ""} aria-label="上一頁">‹</button>
        ${buttons}
        <button class="page-btn" data-page="${current + 1}" ${current === total ? "disabled" : ""} aria-label="下一頁">›</button>
      </div>`;
  }

  return { sidebar, breadcrumb, home, category, cardDetail, search, notFound, esc };
})();

/* ======================================================================
   HR 作業中心 — Router
   ----------------------------------------------------------------------
   Simple hash router. Adding a new HR module never requires touching
   this file — only data.js grows.
   Routes:
     #/                              → Home
     #/category/:catId               → Category page
     #/sop/:catId/:cardId            → SOP / downloads / FAQ detail page
     #/search?q=...&page=N           → Search results
   ====================================================================== */

const Router = (() => {
  const sidebarEl = document.getElementById("sidebarNav");
  const contentEl = document.getElementById("contentInner");

  function parseHash() {
    const raw = window.location.hash.replace(/^#/, "") || "/";
    const [pathPart, queryPart] = raw.split("?");
    const segments = pathPart.split("/").filter(Boolean);
    const params = new URLSearchParams(queryPart || "");
    return { segments, params };
  }

  function render() {
    const { segments, params } = parseHash();
    let html = "";
    let activeCatId = null;

    if (segments.length === 0) {
      html = Render.home();
    } else if (segments[0] === "category" && segments[1]) {
      activeCatId = segments[1];
      html = Render.category(segments[1]);
    } else if (segments[0] === "sop" && segments[1] && segments[2]) {
      activeCatId = segments[1];
      html = Render.cardDetail(segments[1], segments[2]);
    } else if (segments[0] === "search") {
      const q = params.get("q") || "";
      const page = parseInt(params.get("page") || "1", 10);
      html = Render.search(q, page);
    } else {
      html = Render.notFound();
    }

    contentEl.innerHTML = html;
    sidebarEl.innerHTML = Render.sidebar(activeCatId);
    App.afterRender();
    window.scrollTo(0, 0);
    App.closeMobileSidebar();
  }

  function navigateToSearch(query, page) {
    const q = encodeURIComponent(query || "");
    window.location.hash = `#/search?q=${q}&page=${page || 1}`;
  }

  function init() {
    window.addEventListener("hashchange", render);
    render();
  }

  return { init, render, navigateToSearch };
})();

/* ======================================================================
   Firebase 設定檔
   ----------------------------------------------------------------------
   請到 Firebase 主控台 → 專案設定 → 一般 → 你的應用程式，
   把系統顯示的設定值貼到下面對應欄位。
   這組值不是密碼，是「這個網頁要連到哪個 Firebase 專案」的地址，
   真正的存取控制交給 Firestore 安全性規則負責（後面步驟會設定）。
   ====================================================================== */

const FIREBASE_CONFIG = {
  apiKey: "請貼上你的 apiKey",
  authDomain: "請貼上你的 authDomain",
  projectId: "請貼上你的 projectId",
  storageBucket: "請貼上你的 storageBucket",
  messagingSenderId: "請貼上你的 messagingSenderId",
  appId: "請貼上你的 appId"
};

/* ======================================================================
   Firebase 資料載入器
   ----------------------------------------------------------------------
   負責：
   1. 判斷 firebase-config.js 是否已經填好（還沒填就直接跳過，改用
      data.js 內建的本機資料，網頁仍然能正常打開）
   2. 初始化 Firebase 並連線 Firestore
   3. 讀取 categories 集合，回傳給 app.js 覆蓋 HR_DATA.categories
   ====================================================================== */

const FirebaseLoader = (() => {
  let db = null;

  function isConfigured() {
    return typeof FIREBASE_CONFIG !== "undefined"
      && FIREBASE_CONFIG.apiKey
      && !FIREBASE_CONFIG.apiKey.includes("請貼上");
  }

  function init() {
    if (db) return db;
    if (typeof firebase === "undefined") {
      throw new Error("Firebase SDK 尚未載入，請確認 index.html 有引入 firebase-app / firebase-firestore。");
    }
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    return db;
  }

  /**
   * 讀取 Firestore 的 categories 集合，依 order 欄位排序後回傳。
   * 若尚未設定 Firebase 或連線失敗，會丟出例外，由呼叫端決定是否
   * 改用 data.js 內建的本機資料當備援。
   */
  async function loadCategories() {
    if (!isConfigured()) {
      throw new Error("尚未設定 firebase-config.js，略過 Firebase 讀取。");
    }
    init();
    const snapshot = await db.collection("categories").orderBy("order").get();
    if (snapshot.empty) {
      throw new Error("Firestore 的 categories 集合目前是空的，請先完成資料匯入步驟。");
    }
    return snapshot.docs.map(doc => doc.data());
  }

  return { isConfigured, init, loadCategories };
})();

/* ======================================================================
   HR 作業中心 — App Bootstrap & Global Interactions
   ====================================================================== */

const App = (() => {
  const sidebar = document.getElementById("sidebar");
  const scrim = document.getElementById("sidebarScrim");
  const toastStack = document.getElementById("toastStack");

  /* ---------- Toast ---------- */
  function showToast(message) {
    const el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = `
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 13L9 17L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>${message}</span>`;
    toastStack.appendChild(el);
    setTimeout(() => {
      el.style.opacity = "0";
      el.style.transition = "opacity 200ms ease";
      setTimeout(() => el.remove(), 220);
    }, 2600);
  }

  /* ---------- Modal (Feedback) ---------- */
  function openFeedbackModal() {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.id = "feedbackOverlay";
    overlay.innerHTML = `
      <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle">
        <h3 id="feedbackTitle">回報此頁問題</h3>
        <p>告訴我們這份 SOP 哪裡看不懂、資訊過時，或有任何建議，我們會盡快更新內容。</p>
        <textarea id="feedbackText" placeholder="請輸入你的意見..."></textarea>
        <div class="modal-actions">
          <button class="btn btn-ghost btn-sm" id="feedbackCancel" type="button">取消</button>
          <button class="btn btn-primary btn-sm" id="feedbackSubmit" type="button">送出回饋</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    function close() { overlay.remove(); }
    overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
    overlay.querySelector("#feedbackCancel").addEventListener("click", close);
    overlay.querySelector("#feedbackSubmit").addEventListener("click", () => {
      close();
      showToast("已送出，感謝你的回饋");
    });
    overlay.querySelector("textarea").focus();
  }

  /* ---------- Sidebar: collapse (desktop/tablet) & mobile drawer ---------- */
  function toggleCollapse() {
    sidebar.classList.toggle("is-collapsed");
  }
  function openMobileSidebar() {
    sidebar.classList.add("is-open");
    scrim.classList.add("is-visible");
  }
  function closeMobileSidebar() {
    sidebar.classList.remove("is-open");
    scrim.classList.remove("is-visible");
  }

  /* ---------- Accordion (event delegation, lives across re-renders) ---------- */
  function bindAccordionDelegation() {
    document.getElementById("contentInner").addEventListener("click", (e) => {
      const trigger = e.target.closest(".accordion-trigger");
      if (!trigger) return;
      const item = trigger.closest(".accordion-item");
      const panel = item.querySelector(".accordion-panel");
      const isOpen = item.classList.contains("is-open");

      if (isOpen) {
        panel.style.maxHeight = "0px";
        item.classList.remove("is-open");
        trigger.setAttribute("aria-expanded", "false");
      } else {
        item.classList.add("is-open");
        trigger.setAttribute("aria-expanded", "true");
        panel.style.maxHeight = panel.scrollHeight + 24 + "px";
      }
    });
  }

  /* ---------- Download click → toast (prototype has no real files) ---------- */
  function bindDownloadDelegation() {
    document.getElementById("contentInner").addEventListener("click", (e) => {
      const dl = e.target.closest(".download-card");
      if (!dl) return;
      e.preventDefault();
      showToast(`已開始下載「${dl.dataset.fileName}」`);
    });
  }

  /* ---------- Feedback button delegation ---------- */
  function bindFeedbackDelegation() {
    document.getElementById("contentInner").addEventListener("click", (e) => {
      if (e.target.closest("#openFeedbackBtn")) openFeedbackModal();
    });
  }

  /* ---------- Credential reveal / copy (resource-link step field) ---------- */
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    // Fallback for non-secure contexts (e.g. opened via file://)
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (err) { /* no-op */ }
    document.body.removeChild(ta);
    return Promise.resolve();
  }

  function bindCredentialDelegation() {
    document.getElementById("contentInner").addEventListener("click", (e) => {
      const revealBtn = e.target.closest(".reveal-btn");
      if (revealBtn) {
        const code = revealBtn.parentElement.querySelector(".cred-value");
        const isMasked = code.classList.contains("cred-masked");
        if (isMasked) {
          code.textContent = code.dataset.secret;
          code.classList.remove("cred-masked");
          revealBtn.textContent = "隱藏";
        } else {
          code.textContent = "••••••••";
          code.classList.add("cred-masked");
          revealBtn.textContent = "顯示";
        }
        return;
      }
      const copyBtn = e.target.closest(".copy-btn");
      if (copyBtn) {
        copyText(copyBtn.dataset.copy).then(() => showToast("已複製到剪貼簿"));
      }
    });
  }

  /* ---------- Search forms (home hero + search page) ---------- */
  function bindSearchDelegation() {
    document.getElementById("contentInner").addEventListener("submit", (e) => {
      const form = e.target.closest("#homeSearchForm, #searchPageForm");
      if (!form) return;
      e.preventDefault();
      const input = form.querySelector("input[type=search]");
      Router.navigateToSearch(input.value, 1);
    });

    document.getElementById("contentInner").addEventListener("click", (e) => {
      const pageBtn = e.target.closest(".page-btn");
      if (!pageBtn || pageBtn.disabled) return;
      const wrap = pageBtn.closest(".pagination");
      const query = wrap ? wrap.dataset.query : "";
      Router.navigateToSearch(query, parseInt(pageBtn.dataset.page, 10));
    });
  }

  /* ---------- Global (persistent) bindings — run once ---------- */
  function bindGlobal() {
    document.getElementById("hamburgerBtn").addEventListener("click", openMobileSidebar);
    scrim.addEventListener("click", closeMobileSidebar);

    bindAccordionDelegation();
    bindDownloadDelegation();
    bindFeedbackDelegation();
    bindCredentialDelegation();
    bindSearchDelegation();
  }

  /* ---------- Called by Router after every render (re-binds dynamic sidebar button) ---------- */
  function afterRender() {
    const collapseBtn = document.getElementById("sidebarCollapseBtn");
    if (collapseBtn) collapseBtn.addEventListener("click", toggleCollapse);
  }

  /* ---------- Data bootstrap: Firestore first, local data.js as fallback ---------- */
  async function bootstrapData() {
    if (typeof FirebaseLoader === "undefined" || !FirebaseLoader.isConfigured()) {
      // firebase-config.js 還沒填，直接用 data.js 內建的本機資料
      return;
    }
    try {
      const categories = await FirebaseLoader.loadCategories();
      HR_DATA.categories = categories;
      console.info("已從 Firebase 載入最新內容。");
    } catch (err) {
      console.warn("Firebase 資料載入失敗，改用內建本機資料：", err.message);
    }
  }

  async function init() {
    bindGlobal();
    document.getElementById("contentInner").innerHTML = `
      <div class="empty-state">
        <div class="icon">☁️</div>
        <h3>載入中...</h3>
        <p>正在準備內容，請稍候。</p>
      </div>`;
    await bootstrapData();
    Router.init();
  }

  return { init, afterRender, closeMobileSidebar, showToast };
})();

document.addEventListener("DOMContentLoaded", App.init);

</script>
</body>
</html>
