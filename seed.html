<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資料匯入工具｜HR 作業中心</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: var(--sp-5); }
  .seed-box {
    max-width: 560px; width: 100%;
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius-card); padding: var(--sp-6); box-shadow: var(--shadow-card);
  }
  .seed-box h1 { font-size: 22px; margin-bottom: var(--sp-2); }
  .seed-box p { font-size: 14.5px; color: var(--color-body); margin-bottom: var(--sp-4); }
  #seedLog {
    margin-top: var(--sp-4); background: var(--color-bg); border: 1px solid var(--color-border);
    border-radius: var(--radius-sm); padding: var(--sp-3); font-family: monospace; font-size: 13px;
    max-height: 260px; overflow-y: auto; white-space: pre-wrap; color: var(--color-body);
  }
  .warn-box {
    background: var(--color-accent-soft); border-radius: var(--radius-sm);
    padding: var(--sp-3); font-size: 13px; color: #8A6D3F; margin-bottom: var(--sp-4);
  }
</style>
</head>
<body>
  <div class="seed-box">
    <h1>🗄 資料匯入工具</h1>
    <p>這個頁面只做一件事：把 <code>data.js</code> 裡目前寫死的內容，一次性寫入你的 Firebase Firestore 資料庫。之後平常維護內容請直接到 Firebase 主控台修改，不需要再打開這個頁面。</p>
    <div class="warn-box">
      ⚠️ 使用前請確認：<br>
      1. <code>js/firebase-config.js</code> 已經填好你的 Firebase 設定值<br>
      2. Firestore 安全性規則暫時允許寫入（匯入完成後記得改回唯讀，步驟見教學）
    </div>
    <button class="btn btn-primary" id="seedBtn" type="button">開始匯入到 Firestore</button>
    <div id="seedLog">尚未開始。點擊上方按鈕開始匯入。</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
  <script src="js/data.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase-loader.js"></script>
  <script src="js/seed.js"></script>
</body>
</html>
